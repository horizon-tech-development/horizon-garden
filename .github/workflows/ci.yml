name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, horizon-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  native-check-linux:
    runs-on: [self-hosted, Linux, X64, horizon-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Tauri Linux dependencies (read only)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for package in libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf; do
            if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              echo "Installed: $package"
            else
              echo "::error::Missing runner prerequisite: $package"
              missing=1
            fi
          done
          if (( missing )); then
            echo "::error::Provision missing packages outside CI; this workflow must not mutate the persistent runner."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  native-check-windows:
    runs-on: [self-hosted, Windows, X64, winboat]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  native-check-macos:
    runs-on: [self-hosted, macOS, ARM64, mac-horizon-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
