name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, horizon-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  native-check-linux:
    runs-on: [self-hosted, Linux, X64, horizon-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Tauri Linux dependencies
        run: |
          set -e

          dpkg -s libwebkit2gtk-4.1-dev >/dev/null
          dpkg -s libayatana-appindicator3-dev >/dev/null
          dpkg -s librsvg2-dev >/dev/null
          command -v patchelf >/dev/null

          echo "PASS: Tauri Linux dependencies are installed"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  native-check-windows:
    runs-on: [self-hosted, Windows, X64, horizon-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  native-check-macos:
    runs-on: [self-hosted, macOS, X64, horizon-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Native lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
